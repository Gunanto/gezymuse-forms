<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GezyForm — Admin</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/form.css">
</head>
<body>
<div class="wrap wide">
  <header class="brand" id="mainBrand">
    <span class="logo">📝</span>
    <div><h1>GezyForm</h1><p>Admin formulir</p></div>
    <div class="spacer"></div>
    <button id="btnLogout" class="btn ghost small" hidden>Keluar</button>
  </header>

  <div id="toast" class="toast" hidden></div>

  <section id="loginCard" class="card" hidden>
    <h2>Masuk</h2>
    <label>Username
      <input id="username" value="admin" autocomplete="username">
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password">
    </label>
    <p id="loginErr" class="err" hidden></p>
    <button id="btnLogin" class="btn">Masuk</button>
  </section>

  <section id="dashView" hidden>
    <div class="card">
      <h2>＋ Formulir baru</h2>
      <label>Judul
        <input id="newTitle" placeholder="cth: Survei Kepuasan Belajar">
      </label>
      <label>Deskripsi
        <textarea id="newDesc" rows="2" placeholder="Opsional — tampil di atas formulir"></textarea>
      </label>
      <button id="btnCreate" class="btn">Buat formulir</button>
    </div>
    <div id="formList"></div>
  </section>

  <section id="editorView" hidden>
    <header class="gf-topbar">
      <a id="btnBack" class="gf-back" title="Semua formulir">📝</a>
      <input id="fTitleTop" class="gf-doc-title" placeholder="Formulir tanpa judul" autocomplete="off">
      <nav class="gf-tabs">
        <button id="tabQ" class="gf-tab active">Pertanyaan</button>
        <button id="tabA" class="gf-tab">Jawaban <span id="tabABadge" class="gf-count" hidden></span></button>
        <button id="tabS" class="gf-tab">Setelan</button>
      </nav>
      <button id="btnPublishTop" class="gf-publish">Publikasikan</button>
    </header>

    <div class="wrap narrow gf-editor">
      <div id="paneQ">
        <div class="gf-card gf-title-card">
          <input id="fTitle" class="gf-bigtitle" placeholder="Formulir tanpa judul" autocomplete="off">
          <textarea id="fDesc" class="gf-desc" rows="1" placeholder="Deskripsi formulir"></textarea>
          <div class="linkrow">
            <code id="fLink"></code>
            <button id="btnCopy" class="btn small">Salin</button>
            <a id="fOpen" class="btn small ghost" target="_blank" rel="noopener">Buka</a>
          </div>
          <div class="row">
            <button id="btnSaveMeta" class="btn small">Simpan judul & deskripsi</button>
            <span class="muted small" id="pubState"></span>
          </div>
        </div>

        <div id="qList"></div>

        <div class="gf-card gf-qcard" id="qEditorCard">
          <div class="gf-cardtitle" id="qFormTitle">Pertanyaan baru</div>
          <div class="gf-qcard-head">
            <input id="qPrompt" class="gf-qtitle" placeholder="Pertanyaan Tanpa Judul" autocomplete="off">
            <select id="qType" class="gf-qtype"></select>
          </div>
          <div id="qOptions" class="gf-opts"></div>
          <div id="qScale" hidden>
            <div class="row">
              <label>Nilai min<input type="number" id="sMin" value="1" class="gf-num"></label>
              <label>Nilai maks<input type="number" id="sMax" value="5" class="gf-num"></label>
            </div>
            <div class="row">
              <label>Label min<input id="sMinLabel" class="gf-textlike" placeholder="cth: Sangat tidak setuju"></label>
              <label>Label maks<input id="sMaxLabel" class="gf-textlike" placeholder="cth: Sangat setuju"></label>
            </div>
          </div>
          <div class="row" id="qPointsRow">
            <label>Poin (kuis)<input type="number" id="qPoints" value="0" min="0" max="1000" class="gf-num"></label>
          </div>
          <div id="qCorrectWrap" hidden>
            <div class="gf-keyhead">Kunci jawaban</div>
            <div id="qCorrect"></div>
          </div>
          <div class="row" id="qIdentityRow" hidden>
            <label class="check"><input type="checkbox" id="qIdentity"> 🔑 Kunci identitas — satu pengisian per jawaban soal ini</label>
          </div>
          <div class="gf-qcard-foot">
            <button id="btnDupQ" class="iconbtn" title="Duplikat soal ini" hidden>⧉</button>
            <button id="btnDelQ" class="iconbtn" title="Hapus soal ini" hidden>🗑</button>
            <span class="spacer"></span>
            <span class="req-label">Wajib diisi</span>
            <label class="switch"><input type="checkbox" id="qRequired"><span class="slider"></span></label>
          </div>
          <div class="row" style="margin-top:12px">
            <button id="btnSaveQ" class="btn">Simpan</button>
            <button id="btnCancelQ" class="btn ghost" hidden>Batal</button>
          </div>
        </div>
      </div>

      <div id="paneS" hidden>
        <div class="gf-card">
          <h3 class="rv-title">Setelan</h3>
          <div class="checks">
            <label class="check"><input type="checkbox" id="sAccept"> Terima respons</label>
            <label class="check"><input type="checkbox" id="sQuiz"> Mode kuis (ada kunci & nilai)</label>
            <label class="check"><input type="checkbox" id="sShowScore"> Tampilkan nilai setelah submit</label>
            <label class="check"><input type="checkbox" id="sAllowEdit"> Izinkan responden mengubah jawaban</label>
            <label class="check"><input type="checkbox" id="sShQ"> Acak urutan soal</label>
            <label class="check"><input type="checkbox" id="sShO"> Acak urutan opsi</label>
          </div>
          <div class="row">
            <label>Batas waktu (opsional)
              <input type="datetime-local" id="sDeadline">
            </label>
            <label>Maks. respons (opsional)
              <input type="number" id="sMaxResp" min="1" placeholder="tanpa batas">
            </label>
          </div>
          <button id="btnSaveSettings" class="btn">Simpan setelan</button>
        </div>
      </div>
    </div>

    <div class="gf-toolbar">
      <button id="tbAdd" title="Tambah pertanyaan">＋</button>
      <button id="tbPreview" title="Pratinjau formulir">👁</button>
    </div>
  </section>

  <section id="resultsView" hidden>
    <button id="btnBack2" class="btn ghost small">← Semua formulir</button>
    <div class="card">
      <h2 id="resTitle">Hasil</h2>
      <p class="muted" id="resCount"></p>
      <div class="row">
        <a id="btnCsv" class="btn small" href="#">⬇ Ekspor CSV</a>
        <a id="btnWord" class="btn small ghost" href="#">⬇ Ekspor Word</a>
      </div>
      <div class="tabs">
        <button id="tabSummary" class="tab active">Ringkasan</button>
        <button id="tabResponses" class="tab">Respons</button>
      </div>
    </div>
    <div id="resSummary"></div>
    <div id="resResponses" hidden>
      <div id="respDetail"></div>
      <div class="card">
        <div id="respTable"></div>
        <div id="respPager" class="row" style="margin-top:12px"></div>
      </div>
    </div>
  </section>
</div>
<script src="/js/admin.js"></script>
<script src="/js/results.js"></script>
</body>
</html>
